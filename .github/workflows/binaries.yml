# [xihanzu-NR]
# Build the native compiler for every platform a user can legitimately be on,
# and publish each one as its own npm package.
#
# Why this exists: the package used to ship ONE binary, an ELF x86-64 file
# linked against glibc 2.34. `npm i hydrascript` therefore installed cleanly on
# macOS, on Alpine, on an ARM VPS and on any distro older than Ubuntu 22.04, and
# then every command died with a loader error that named neither the platform
# nor the fix. `bin/hydra.js` now resolves `@hydrascript/<platform>-<arch>` from
# optionalDependencies; this workflow is what puts those packages on npm.
#
# The glibc floor is a property of the RUNNER, not of cargo: a binary linked on
# 24.04 refuses to start on 22.04. That is why the linux-gnu jobs are pinned to
# the oldest LTS a runner offers rather than to `ubuntu-latest`.

name: binaries

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build every target but publish none'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # trusted publishing: no long-lived npm token anywhere

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc. 22.04 is the floor: older distros are served by -musl.
          - target: linux-x64
            os: ubuntu-22.04
            rust: x86_64-unknown-linux-gnu
            libc: gnu
            supports_addon: true
          - target: linux-arm64
            os: ubuntu-22.04-arm
            rust: aarch64-unknown-linux-gnu
            libc: gnu
            supports_addon: true
          # musl: Alpine and the static-image world. Built inside Alpine so the
          # toolchain is musl throughout rather than a cross-link that only
          # looks portable. No addon: cargo refuses a cdylib for this target
          # ("does not support these crate types"), so the package ships the CLI.
          - target: linux-x64-musl
            os: ubuntu-22.04
            rust: x86_64-unknown-linux-musl
            libc: musl
            supports_addon: false
          - target: linux-arm64-musl
            os: ubuntu-22.04-arm
            rust: aarch64-unknown-linux-musl
            libc: musl
            supports_addon: false
          # `macos-13` is the last image GitHub ships for Intel, and it is
          # deprecated: jobs sit in the queue for hours and sometimes never
          # start, which reads as "the Intel build is broken" when it is really
          # "there is no machine". `macos-15-intel` is the supported replacement.
          - target: darwin-x64
            os: macos-15-intel
            rust: x86_64-apple-darwin
            libc: ''
            supports_addon: true
          - target: darwin-arm64
            os: macos-14
            rust: aarch64-apple-darwin
            libc: ''
            supports_addon: true
          - target: win32-x64
            os: windows-2022
            rust: x86_64-pc-windows-msvc
            libc: ''
            supports_addon: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      # Windows cannot leave a symbol unresolved: an addon links against the
      # import library Node publishes for exactly this purpose, and node-gyp
      # downloads the same file. Without it `link.exe` fails with LNK1120 on
      # every `napi_*` call.
      - name: Fetch node.lib (Windows addon link)
        if: ${{ runner.os == 'Windows' && matrix.supports_addon }}
        shell: bash
        run: |
          set -euo pipefail
          # The FULL version, not the major: `dist/v22/win-x64/node.lib` is a
          # 404, and the file lives under `dist/v<major.minor.patch>/`.
          NODE_V=$(node -p "process.versions.node")
          ARCH="${{ contains(matrix.target, 'arm64') && 'win-arm64' || 'win-x64' }}"
          mkdir -p compiler-rs/node-lib
          curl -fsSL "https://nodejs.org/dist/v${NODE_V}/${ARCH}/node.lib" \
            -o compiler-rs/node-lib/node.lib
          ls -la compiler-rs/node-lib/

      - name: Build the compiler and its addon
        shell: bash
        working-directory: compiler-rs
        run: |
          set -euo pipefail
          # Two builds, not one. The CLI is `[[bin]]` and must NOT contain the
          # Node-API imports: Linux leaves them undefined in a cdylib and the
          # loader fills them in, but the macOS and Windows linkers refuse to
          # produce a binary with an undefined symbol — every darwin and win32
          # job died at `Undefined symbols: _napi_create_function` for that
          # reason. The addon is a `cdylib` build with `node-addon` on.
          cargo build --release --locked --target ${{ matrix.rust }} --bin hydra
          OUT="target/${{ matrix.rust }}/release"
          mkdir -p ../pkg/bin

          # The addon cannot be produced for musl: cargo says the target "does
          # not support these crate types". A musl package therefore ships the
          # CLI alone and `bin/hydra.js` falls back to spawning it — which is the
          # documented path, not a degraded one.
          BUILD_ADDON="${{ matrix.supports_addon }}"
          if [ "$BUILD_ADDON" = "true" ]; then
            # An addon leaves its `napi_*` imports unresolved on purpose: Node
            # supplies them when it loads the library. Linux accepts that in a
            # shared object and macOS needs to be told to accept it
            # (`-undefined dynamic_lookup`); Windows has no such concept and
            # needs the import library to link against, which Node ships.
            ADDON_LINK=''
            if [ "${{ runner.os }}" = "macOS" ]; then
              ADDON_LINK='-C link-arg=-undefined -C link-arg=dynamic_lookup'
            elif [ "${{ runner.os }}" = "Windows" ]; then
              # The import library fetched above; absolute so the linker is not
              # asked to search relative to the crate directory.
              ADDON_LINK="-C link-arg=$(pwd -W 2>/dev/null || pwd)/node-lib/node.lib"
            fi
            # shellcheck disable=SC2086
            cargo rustc --release --locked --target ${{ matrix.rust }} --lib \
              --features node-addon --crate-type cdylib -- $ADDON_LINK
          fi

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$OUT/hydra.exe" ../pkg/bin/hydra.exe
            [ "$BUILD_ADDON" = "true" ] && cp "$OUT/hydra.dll" ../pkg/bin/hydra.node || true
          else
            cp "$OUT/hydra" ../pkg/bin/hydra
            if [ "$BUILD_ADDON" = "true" ]; then
              if [ "${{ runner.os }}" = "macOS" ]; then
                cp "$OUT/libhydra.dylib" ../pkg/bin/hydra.node
              else
                cp "$OUT/libhydra.so" ../pkg/bin/hydra.node
              fi
            fi
            chmod +x ../pkg/bin/hydra
          fi

          # The binary must not IMPORT Node-API symbols: nothing in the CLI
          # resolves them, and their presence is exactly what broke the
          # cross-platform link. Checked here so a regression fails the build
          # that introduced it rather than a platform job three weeks later.
          #
          # Through a script, not `nm -D | grep -q ' napi_'`. That grep matched
          # the NAME anywhere on the line, so a binary that DEFINES a napi symbol
          # — which the addon legitimately does, and which a stripped CLI can
          # carry as a local — was reported as a violation. The script reads the
          # symbol TYPE and only `U` (undefined) counts.
          if [ "${{ runner.os }}" != "Windows" ]; then
            node ../scripts/check-no-napi-imports.mjs ../pkg/bin/hydra
          else
            echo "Windows binaries are PE; nm cannot read their import table, and the"
            echo "Node-API imports are caught on the ELF/Mach-O jobs plus by the link"
            echo "itself: link.exe fails with LNK1120 on an unresolved napi_* symbol."
          fi

      # The binary must START on the machine that built it. A build that
      # succeeds and an artifact that cannot run is the exact failure this
      # matrix exists to prevent, and only executing it proves the difference.
      - name: The shipped binary starts
        shell: bash
        run: ./pkg/bin/hydra --version

      - name: Assemble the per-platform package
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const version = require("./package.json").version;
            const pkg = {
              name: "@hydrascript/${{ matrix.target }}",
              version,
              description: "The HydraScript native compiler for ${{ matrix.target }}.",
              os: ["${{ matrix.os == 'windows-2022' && 'win32' || (startsWith(matrix.os, 'macos') && 'darwin' || 'linux') }}"],
              cpu: ["${{ contains(matrix.target, 'arm64') && 'arm64' || 'x64' }}"],
              ...(${{ matrix.libc == 'musl' }} ? { libc: ["musl"] } : {}),
              ...(${{ matrix.libc == 'gnu' }} ? { libc: ["glibc"] } : {}),
              files: ["bin/"],
              license: "MIT",
              repository: { type: "git", url: "git+https://github.com/hanxthvy/hydrascript.git" },
            };
            fs.writeFileSync("pkg/package.json", JSON.stringify(pkg, null, 2));
          '

      - name: Publish the platform package
        if: ${{ !inputs.dry_run }}
        shell: bash
        working-directory: pkg
        run: |
          set -euo pipefail
          # Trusted publishing needs npm >= 11.5.1, and the runner image is not a
          # fixed thing: `node-version: '22'` resolves to whatever 22.x the image
          # ships, and the npm bundled with it has been 10.9.x on the ubuntu-22.04
          # image — which failed here with "npm 10.9.9 is too old".
          #
          # `npm install -g npm@^11.5.1` is NOT the fix: it writes to the system
          # prefix (`/usr/local/share/man`) and dies with EACCES on macOS runners.
          # Neither is `npx npm@11`, which cannot publish with provenance because
          # the OIDC token is minted for the running npm process.
          #
          # So the version is installed into a PRIVATE prefix and put on PATH:
          # writable on every runner, no sudo, and `npm` is genuinely npm 11 from
          # then on. The check below proves it, and names the path it found.
          #
          # `GITHUB_PATH` is written for LATER steps, not this one — GitHub reads
          # the file between steps. The install and the publish used to share a
          # step, so writing GITHUB_PATH and then calling bare `npm` published
          # with the image's 10.9.9 and failed with "too old for trusted
          # publishing" seven times. Two things are needed, and both are here:
          #
          #   1. GITHUB_PATH, so any later step inherits npm 11 (the split this
          #      file will eventually want);
          #   2. an explicit NPM_BIN used by this step, because GITHUB_PATH does
          #      not apply to the shell that wrote it.
          npm install --prefix "$RUNNER_TEMP/npm11" --no-audit --no-fund npm@^11.5.1
          NPM_BIN="$RUNNER_TEMP/npm11/node_modules/.bin/npm"
          export NPM_BIN
          echo "$RUNNER_TEMP/npm11/node_modules/.bin" >> "$GITHUB_PATH"
          "$NPM_BIN" --version
          node -e '
            const { execFileSync } = require("child_process");
            const bin = process.env.NPM_BIN;
            const v = execFileSync(bin, ["--version"], { encoding: "utf8" }).trim();
            const [maj, min, patch] = v.split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && patch >= 1)));
            if (!ok) {
              console.error(`npm ${v} is too old for trusted publishing (needs >= 11.5.1)`);
              console.error(`resolved from: ${bin}`);
              process.exit(1);
            }
            console.log(`npm ${v} supports trusted publishing`);
          '
          "$NPM_BIN" publish --provenance --access public

      - uses: actions/upload-artifact@v4
        # Always: a failed publish still leaves a binary somebody can download
        # and run, which is the difference between debugging this and guessing.
        if: ${{ always() }}
        with:
          name: ${{ matrix.target }}
          path: pkg/

  # The ROOT manifest (`optionalDependencies`) is wired by `release.yml`, not
  # here. Two workflows writing the same field is how they drift: this job used
  # to commit the wiring while `release.yml` published the root from a manifest
  # that did not have it yet, and every release up to 0.12.1 shipped
  # `optionalDependencies: {}` — installable everywhere, runnable on one platform.
  #
  # `release.yml` fills the field, verifies every wired package exists at this
  # version, and publishes in one job, so the tag is never broken.
