# [xihanzu-NR]
# Release to npm from CI, with no stored token.
#
# Why this instead of `npm publish` from a laptop:
#
#   1. npm now enforces an interactive web/2FA step for publishing. A token with
#      "bypass 2FA" set is supposed to skip it, but the registry refuses one
#      anyway (verified: the same token answers `GET /-/whoami` with 200 and is
#      rejected with 403 on a publish-shaped PUT). Trusted publishing does not go
#      through that path at all.
#   2. OIDC means no long-lived credential anywhere. There is nothing to leak in
#      a chat, a shell history, or a dotfile, and nothing to rotate.
#   3. The package gets `--provenance`, so a consumer can verify the tarball was
#      built from this commit by this workflow.
#
# ONE-TIME SETUP (the user does this, once, on npmjs.com):
#   Package `hydrascript` -> Settings -> Trusted Publisher -> GitHub Actions:
#     Organization/user : hanxthvy
#     Repository        : hydrascript
#     Workflow filename : release.yml
#     Environment       : (leave empty)
#   Until that is configured the publish step will be refused; that is expected.
#
# Then: Actions -> release -> Run workflow. Or push a tag `v0.3.0`.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag to publish under'
        required: true
        default: latest
      dry_run:
        description: 'Pack and validate only, do not upload'
        type: boolean
        default: false
  # NO `push: tags` trigger, on purpose.
  #
  # Both workflows used to fire on a `v*` tag, so one tag started them
  # concurrently — and `release.yml` publishes the root package, which names the
  # seven `@hydrascript/*` packages as optional dependencies. If it won the race
  # the guard below stopped it with "run the binaries workflow first", which is a
  # red X on a release that was not wrong. When the guard did not exist yet, it
  # published a root manifest pointing at packages that did not exist.
  #
  # A tag now does exactly one thing: build and publish the platform packages.
  # The root release is a deliberate second action, after those exist.
  workflow_run:
    workflows: ['binaries']
    types: [completed]

permissions:
  contents: read
  # Required for trusted publishing: this is what mints the OIDC token npm
  # exchanges for a short-lived publish credential.
  id-token: write

jobs:
  publish:
    name: build, verify, publish
    # ONLY a tag push may start this automatically.
    #
    # `workflow_run` fires for every completed `binaries` run, including one a
    # person dispatched by hand — and `inputs.dry_run` is EMPTY on a
    # `workflow_run` event, so `if: !inputs.dry_run` was true and a DRY RUN of the
    # platform build published `hydrascript@latest`. The event that triggered the
    # upstream run is part of this context, so it is checked directly. A manual
    # `workflow_dispatch` here is a person deciding, and is still allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    # Required reviewers on this environment are the human gate between "tests
    # are green" and "a version exists that cannot be unpublished". Configure it
    # in repo Settings -> Environments -> npm-release.
    environment: npm-release
    # NOT ubuntu-latest, and this is load-bearing.
    #
    # `ubuntu-latest` tracks 24.04, whose glibc is 2.39. A binary linked there
    # carries a `GLIBC_2.39` symbol requirement and refuses to START on anything
    # older — on the machine this project is deployed to (glibc 2.35) every
    # non-build subcommand died with "weak version `GLIBC_2.39' not found".
    # `hydra build` was unaffected because it runs the Node runner, which is why
    # the failure reached npm before anyone saw it: the one command that could
    # not run was the one nobody runs in CI.
    #
    # 22.04 (glibc 2.35) is the oldest LTS runner available, so a binary built
    # here runs on 22.04 and anything newer. Older still means the user builds
    # from source, which README documents.
    runs-on: ubuntu-22.04
    steps:
      # The COMMIT THAT WAS BUILT, not the default branch HEAD.
      #
      # On `workflow_run` a bare checkout materialises main, while the platform
      # packages came from tag `vY`. The version is read from that checkout, so a
      # commit pushed to main after the tag would publish its number under the
      # tag's binaries — and `--provenance` would attest "built from commit X on
      # main", which is not the tagged object at all.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # `git describe` needs the tag that points at this commit

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm CLI 11.5.1+, and the Node 22 image already
      # ships one. It is CHECKED rather than installed: `npm install -g` writes
      # to the system prefix, and that is how every darwin job in `binaries.yml`
      # died with `EACCES: mkdir '/usr/local/share/man/man5'` — a publish step
      # that fails on permissions says nothing about the package.
      - name: Ensure a recent npm
        run: |
          set -euo pipefail
          # Same private-prefix install as `binaries.yml`, and for the same
          # reason: the image's bundled npm has been 10.9.x, which cannot do
          # trusted publishing, and `npm install -g` hits EACCES on the system
          # prefix. `GITHUB_PATH` carries the override into later steps, which a
          # plain `export` cannot do across steps.
          npm install --prefix "$RUNNER_TEMP/npm11" --no-audit --no-fund npm@11.5.1
          echo "$RUNNER_TEMP/npm11/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm11/node_modules/.bin/npm" --version
          node -e '
            const { execFileSync } = require("child_process");
            const v = execFileSync(process.env.RUNNER_TEMP + "/npm11/node_modules/.bin/npm", ["--version"], { encoding: "utf8" }).trim();
            const [maj, min, patch] = v.split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && patch >= 1)));
            if (!ok) {
              console.error(`npm ${v} is too old for trusted publishing (needs >= 11.5.1)`);
              process.exit(1);
            }
            console.log(`npm ${v} supports trusted publishing`);
          '

      - uses: dtolnay/rust-toolchain@1.90.0

      # The tarball ships prebuilt binaries, so they must be built here and must
      # be the ones the tests below exercised.
      - name: Build the compiler
        run: |
          set -euo pipefail
          cd compiler-rs
          # CLI and addon are separate builds; see `binaries.yml` for why. The
          # plain `libhydra.so` no longer contains the Node-API export, so
          # copying it to `hydra.node` publishes an addon Node cannot use.
          cargo build --release --locked --bin hydra
          # `addon` = release + `panic = "unwind"`, because this library is loaded
          # into Node and a panic there must not abort the host process.
          cargo rustc --profile addon --locked --lib --features node-addon --crate-type cdylib
          mkdir -p ../bin
          cp target/release/hydra ../bin/hydra
          cp target/addon/libhydra.so ../bin/hydra.node
          chmod +x ../bin/hydra
          node -e 'if (!require("../bin/hydra.node").compile) { console.error("bin/hydra.node has no compile export"); process.exit(1) }'

      - name: Rust tests
        run: cd compiler-rs && cargo test

      # The repo's own dependencies. Without them `entrypoint.test.mjs` cannot
      # build a project (esbuild) and the plugin tests skip; the first real run
      # of this workflow had 6 of 25 tests failing for exactly that reason.
      - name: Install repo dependencies
        run: npm ci --no-audit --no-fund

      # A TypeScript for the dts test to point at. Without it that test either
      # skips (which is banned in CI) or resolves an unpredictable copy; the
      # first real run used one whose version changed the command-line rules.
      - name: Install TypeScript
        run: npm install -g typescript@5.6.3

      - name: Node tests
        env:
          CI: 'true'
        run: |
          export TSC="$(npm root -g)/typescript/lib/tsc.js"
          echo "tsc: $TSC"
          node --test packages/cli/plugin.test.mjs \
                     packages/cli/server.test.mjs \
                     packages/cli/entrypoint.test.mjs \
                     packages/cli/dts.test.mjs

      # The four example projects are the real regression suite — the thing most
      # likely to catch a compiler change, so a release must not skip it.
      - name: Install example dependencies
        run: |
          for d in examples/*/; do
            if [ -f "$d/package.json" ]; then
              (cd "$d" && npm install --no-audit --no-fund)
            fi
          done
      - name: Examples
        run: bash scripts/hx-examples-check.sh

      # The last gate before something irreversible: pack, install into a clean
      # project, scaffold an app and build it with the installed binary.
      - name: Pack, install, build
        run: bash scripts/pack-install-check.sh

      # The gate that the glibc bug walked straight through.
      #
      # `pack-install-check.sh` builds a scaffolded app, and building goes
      # through the Node runner — so it passed while the shipped native binary
      # could not start at all. This runs `hydra check`, which is the binary
      # itself, against the oldest glibc a runner offers... except the runner is
      # what CI is. So instead it records the glibc the binary requires and
      # fails if that is newer than the runner it was built on, which is the
      # condition that makes the artifact unusable downstream.
      - name: The shipped binary must start, and must not need a newer glibc than the runner has
        run: |
          set -euo pipefail
          ./bin/hydra --version
          ./bin/hydra check examples/blog/src/App.hyx >/dev/null && echo "binary runs"
          REQUIRES="$(objdump -T bin/hydra | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          RUNNER="GLIBC_$(ldd --version | head -1 | grep -o '[0-9]\+\.[0-9]\+$')"
          echo "binary requires: $REQUIRES; runner provides: $RUNNER"
          # `<=`, not `=`: a binary may legitimately need less than the runner
          # offers. What must never happen is needing MORE — that is the
          # combination that makes the artifact dead on every older system.
          NEWEST="$(printf '%s\n%s\n' "$REQUIRES" "$RUNNER" | sort -V | tail -1)"
          if [ "$NEWEST" != "$RUNNER" ]; then
            echo "::error::bin/hydra requires $REQUIRES but the runner only provides $RUNNER."
            echo "Users on an older glibc cannot run it. Keep runs-on pinned to the oldest LTS (ubuntu-22.04), or document the floor in README."
            exit 1
          fi

      # The root package must NAME the per-platform packages before it is
      # published, or it goes out with `optionalDependencies: {}` — which is what
      # every release up to 0.12.1 did. `bin/hydra.js` resolves
      # `@hydrascript/<triple>` from that field, so an empty one means the
      # installer picks nothing and the first command dies on a machine that is
      # not Linux x86-64. The wiring used to be a separate job that committed
      # AFTER this publish, which is a window in which the tag is broken.
      # A `workflow_run` fires for a FAILED binaries run too, and publishing the
      # root after a failed platform build is the one thing that must never
      # happen. `workflow_dispatch` has no `workflow_run` context, so the check is
      # skipped there — a manual run is a person deciding, and the manifest guard
      # below still refuses when a package is missing.
      - name: Refuse when the binaries run did not succeed
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "::error::binaries concluded '${{ github.event.workflow_run.conclusion }}'; not publishing the root package"
          exit 1

      - name: Wire the platform packages into the root manifest
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const { execFileSync } = require("child_process");
            const pkg = require("./package.json");
            const version = pkg.version;
            const targets = [
              "linux-x64", "linux-arm64",
              "linux-x64-musl", "linux-arm64-musl",
              "darwin-x64", "darwin-arm64",
              "win32-x64",
            ];
            const absent = [];
            for (const t of targets) {
              const name = `@hydrascript/${t}`;
              let got = "";
              try {
                got = execFileSync("npm", ["view", `${name}@${version}`, "version"], {
                  encoding: "utf8", stdio: ["ignore", "pipe", "ignore"],
                }).trim();
              } catch {
                got = "";
              }
              if (got !== version) absent.push(`${name}@${version}`);
            }
            if (absent.length) {
              // Refusing is the point. Publishing the root with a field naming
              // packages that are not there makes `npm i hydrascript` a 404 with
              // no explanation; publishing with an EMPTY field makes it install
              // and then die at the first command. Neither is recoverable by the
              // person who hit it, so the release stops here and names what is
              // missing.
              console.error(
                "these platform packages are not on npm at this version, so the " +
                "root manifest would point at nothing:\n  " + absent.join("\n  ") +
                "\nRun the `binaries` workflow for this tag first.",
              );
              process.exit(1);
            }
            pkg.optionalDependencies = Object.fromEntries(
              targets.map((t) => [`@hydrascript/${t}`, version]),
            );
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log(`optionalDependencies: ${targets.length} targets at ${version}`);
          '

      # The tag and the manifest must agree, and the tag must point at the
      # commit that was checked out. `--provenance` attests "this tarball came
      # from this commit"; without this line the version could be 0.15.1 while
      # the tag says v0.15.0, and the attestation would be true about the commit
      # and false about the release.
      - name: The tag must point at this commit, and its number must match
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          DESCRIBED="$(git describe --tags --exact-match 2>/dev/null || true)"
          echo "checkout is at $(git rev-parse --short HEAD), package version is $VERSION, tag is '${DESCRIBED:-none}'"
          if [ "$DESCRIBED" != "v$VERSION" ]; then
            echo "::error::HEAD is not exactly tag v$VERSION (got '${DESCRIBED:-no tag}'). Publishing would put $VERSION on npm from an untagged commit."
            exit 1
          fi

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || 'latest' }}"
          echo "publishing $(node -p "require('./package.json').name + '@' + require('./package.json').version") as dist-tag '$TAG'"
          npm publish --provenance --access public --tag "$TAG"

      - name: Dry run (no upload)
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --access public
