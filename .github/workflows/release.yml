# [xihanzu-NR]
# Release to npm from CI, with no stored token.
#
# Why this instead of `npm publish` from a laptop:
#
#   1. npm now enforces an interactive web/2FA step for publishing. A token with
#      "bypass 2FA" set is supposed to skip it, but the registry refuses one
#      anyway (verified: the same token answers `GET /-/whoami` with 200 and is
#      rejected with 403 on a publish-shaped PUT). Trusted publishing does not go
#      through that path at all.
#   2. OIDC means no long-lived credential anywhere. There is nothing to leak in
#      a chat, a shell history, or a dotfile, and nothing to rotate.
#   3. The package gets `--provenance`, so a consumer can verify the tarball was
#      built from this commit by this workflow.
#
# ONE-TIME SETUP (the user does this, once, on npmjs.com):
#   Package `hydrascript` -> Settings -> Trusted Publisher -> GitHub Actions:
#     Organization/user : hanxthvy
#     Repository        : hydrascript
#     Workflow filename : release.yml
#     Environment       : (leave empty)
#   Until that is configured the publish step will be refused; that is expected.
#
# Then: Actions -> release -> Run workflow. Or push a tag `v0.3.0`.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag to publish under'
        required: true
        default: latest
      dry_run:
        description: 'Pack and validate only, do not upload'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # Required for trusted publishing: this is what mints the OIDC token npm
  # exchanges for a short-lived publish credential.
  id-token: write

jobs:
  publish:
    name: build, verify, publish
    # NOT ubuntu-latest, and this is load-bearing.
    #
    # `ubuntu-latest` tracks 24.04, whose glibc is 2.39. A binary linked there
    # carries a `GLIBC_2.39` symbol requirement and refuses to START on anything
    # older — on the machine this project is deployed to (glibc 2.35) every
    # non-build subcommand died with "weak version `GLIBC_2.39' not found".
    # `hydra build` was unaffected because it runs the Node runner, which is why
    # the failure reached npm before anyone saw it: the one command that could
    # not run was the one nobody runs in CI.
    #
    # 22.04 (glibc 2.35) is the oldest LTS runner available, so a binary built
    # here runs on 22.04 and anything newer. Older still means the user builds
    # from source, which README documents.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm CLI 11.5.1+, and the Node 22 image already
      # ships one. It is CHECKED rather than installed: `npm install -g` writes
      # to the system prefix, and that is how every darwin job in `binaries.yml`
      # died with `EACCES: mkdir '/usr/local/share/man/man5'` — a publish step
      # that fails on permissions says nothing about the package.
      - name: Ensure a recent npm
        run: |
          node -e '
            const { execFileSync } = require("child_process");
            const v = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
            const [maj, min, patch] = v.split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && patch >= 1)));
            if (!ok) {
              console.error(`npm ${v} is too old for trusted publishing (needs >= 11.5.1)`);
              process.exit(1);
            }
            console.log(`npm ${v} supports trusted publishing`);
          '

      - uses: dtolnay/rust-toolchain@stable

      # The tarball ships prebuilt binaries, so they must be built here and must
      # be the ones the tests below exercised.
      - name: Build the compiler
        run: |
          set -euo pipefail
          cd compiler-rs
          cargo build --release --locked
          mkdir -p ../bin
          cp target/release/hydra ../bin/hydra
          cp target/release/libhydra.so ../bin/hydra.node
          chmod +x ../bin/hydra

      - name: Rust tests
        run: cd compiler-rs && cargo test

      # The repo's own dependencies. Without them `entrypoint.test.mjs` cannot
      # build a project (esbuild) and the plugin tests skip; the first real run
      # of this workflow had 6 of 25 tests failing for exactly that reason.
      - name: Install repo dependencies
        run: npm ci --no-audit --no-fund

      # A TypeScript for the dts test to point at. Without it that test either
      # skips (which is banned in CI) or resolves an unpredictable copy; the
      # first real run used one whose version changed the command-line rules.
      - name: Install TypeScript
        run: npm install -g typescript@5.6.3

      - name: Node tests
        env:
          CI: 'true'
        run: |
          export TSC="$(npm root -g)/typescript/lib/tsc.js"
          echo "tsc: $TSC"
          node --test packages/cli/plugin.test.mjs \
                     packages/cli/server.test.mjs \
                     packages/cli/entrypoint.test.mjs \
                     packages/cli/dts.test.mjs

      # The four example projects are the real regression suite — the thing most
      # likely to catch a compiler change, so a release must not skip it.
      - name: Install example dependencies
        run: |
          for d in examples/*/; do
            if [ -f "$d/package.json" ]; then
              (cd "$d" && npm install --no-audit --no-fund)
            fi
          done
      - name: Examples
        run: bash scripts/hx-examples-check.sh

      # The last gate before something irreversible: pack, install into a clean
      # project, scaffold an app and build it with the installed binary.
      - name: Pack, install, build
        run: bash scripts/pack-install-check.sh

      # The gate that the glibc bug walked straight through.
      #
      # `pack-install-check.sh` builds a scaffolded app, and building goes
      # through the Node runner — so it passed while the shipped native binary
      # could not start at all. This runs `hydra check`, which is the binary
      # itself, against the oldest glibc a runner offers... except the runner is
      # what CI is. So instead it records the glibc the binary requires and
      # fails if that is newer than the runner it was built on, which is the
      # condition that makes the artifact unusable downstream.
      - name: The shipped binary must start, and must not need a newer glibc than the runner has
        run: |
          set -euo pipefail
          ./bin/hydra --version
          ./bin/hydra check examples/blog/src/App.hyx >/dev/null && echo "binary runs"
          REQUIRES="$(objdump -T bin/hydra | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          RUNNER="GLIBC_$(ldd --version | head -1 | grep -o '[0-9]\+\.[0-9]\+$')"
          echo "binary requires: $REQUIRES; runner provides: $RUNNER"
          # `<=`, not `=`: a binary may legitimately need less than the runner
          # offers. What must never happen is needing MORE — that is the
          # combination that makes the artifact dead on every older system.
          NEWEST="$(printf '%s\n%s\n' "$REQUIRES" "$RUNNER" | sort -V | tail -1)"
          if [ "$NEWEST" != "$RUNNER" ]; then
            echo "::error::bin/hydra requires $REQUIRES but the runner only provides $RUNNER."
            echo "Users on an older glibc cannot run it. Keep runs-on pinned to the oldest LTS (ubuntu-22.04), or document the floor in README."
            exit 1
          fi

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || 'latest' }}"
          echo "publishing $(node -p "require('./package.json').name + '@' + require('./package.json').version") as dist-tag '$TAG'"
          npm publish --provenance --access public --tag "$TAG"

      - name: Dry run (no upload)
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --access public
