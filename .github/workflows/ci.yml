# [xihanzu-NR]
# Continuous integration.
#
# Why this exists at all: the repository has 348 Rust tests and a four-project
# example suite that is the real regression test (it pulls 14 real React
# packages), and until now all of it ran only when somebody remembered to run
# it. A green suite that nobody runs is documentation, not a guarantee.
#
# The jobs are split so a failure says WHAT broke: the compiler, the runner, or
# the built output actually failing to run. The runtime gate job needs Chrome,
# which the ubuntu runner provides; it is the only check that can catch "the
# build succeeded and the page is blank".
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the Rust build reproducible and quiet about incremental state.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: compiler (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler-rs
      # `build.rs` reads ../runtime/hydra.ts to generate the helper list and
      # fails the build if the scan finds too few names, so a broken scan is a
      # compile error rather than a silently empty table.
      - name: Build
        working-directory: compiler-rs
        run: cargo build --release --locked
      - name: Test
        working-directory: compiler-rs
        run: cargo test --locked
      # The example suite and the runner both shell out to bin/hydra, so the
      # CI checkout has to place the freshly built binary where they look.
      - name: Install compiler into bin/
        run: |
          cp compiler-rs/target/release/hydra bin/hydra
          cp compiler-rs/target/release/libhydra.so bin/hydra.node
          chmod +x bin/hydra
      - uses: actions/upload-artifact@v4
        with:
          name: hydra-binaries
          path: |
            bin/hydra
            bin/hydra.node
          retention-days: 7

  runner:
    name: runner (node --test)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: hydra-binaries
          path: bin/
      - run: chmod +x bin/hydra
      # The example projects have their own dependencies (react, and in the
      # ecosystem example 14 real packages), so they are installed once here
      # and reused by the examples job through the cache key.
      - name: Install example dependencies
        run: |
          for d in examples/*/; do
            if [ -f "$d/package.json" ]; then
              (cd "$d" && npm install --no-audit --no-fund)
            fi
          done
      - run: node --test packages/cli/*.test.mjs

  examples:
    name: examples (build + runtime gate)
    runs-on: ubuntu-latest
    needs: runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: hydra-binaries
          path: bin/
      - run: chmod +x bin/hydra
      - name: Install example dependencies
        run: |
          for d in examples/*/; do
            if [ -f "$d/package.json" ]; then
              (cd "$d" && npm install --no-audit --no-fund)
            fi
          done
      # Chrome is what the runtime gate drives. The gate skips (with a reason,
      # exit 0) when no browser exists, which is the right behaviour on a
      # contributor's laptop and the wrong behaviour here: CI is exactly where
      # the page must actually be loaded once.
      - name: Chrome for the runtime gate
        run: |
          which google-chrome || which google-chrome-stable \
            || which chromium || which chromium-browser
      - name: Build every example (gate on)
        run: bash scripts/hx-examples-check.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: examples-log
          path: /tmp/hx-examples.log
          retention-days: 7

  # The type declarations: the part that makes a `.hyx` module visible to `tsc`.
  # Run as its own job because `tsc` is the tool that decides, and its output is
  # what a consumer sees. It regenerates declarations for a real project and
  # fails if the module cannot be found or a wrong prop is accepted.
  types:
    name: TypeScript declarations (tsc)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The declaration emitter lives in the compiler, so it must be built first.
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the compiler
        run: |
          cd compiler-rs
          cargo build --release --locked
          mkdir -p ../bin
          cp target/release/hydra ../bin/hydra
          chmod +x ../bin/hydra
      - name: Install TypeScript
        run: npm install -g typescript@5.6.3
      - name: Check declarations against tsc
        run: node --test packages/cli/dts.test.mjs

  # `hydra init` must produce a project the runner accepts; the scaffold writes
  # its own idea of an entrypoint in Rust, so this is the check that the two
  # cannot drift. It is cheap and it caught a real class of bug before.
  scaffold:
    name: scaffold round-trip (init -> build)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: hydra-binaries
          path: bin/
      - run: chmod +x bin/hydra
      - name: Init a project and build it
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          "$GITHUB_WORKSPACE/bin/hydra" init .
          npm install --no-audit --no-fund
          HYDRA_NO_GATE=1 "$GITHUB_WORKSPACE/bin/hydra" build
          test -f dist/index.html
          echo "scaffold build produced dist/index.html"

  # Everything above tests the REPOSITORY. What a user installs is the TARBALL,
  # and the two differ in ways that pass every unit test and break on install: a
  # missing entry in `files`, a binary that did not get packed, a plugin that
  # resolves the compiler relative to a directory that is not shipped. This packs,
  # installs into a clean project, and builds a scaffolded app with the installed
  # binary.
  pack:
    name: pack + install + build (what a user gets)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: hydra-binaries
          path: bin/
      - run: chmod +x bin/hydra
      - name: Pack, install, build
        run: bash scripts/pack-install-check.sh
